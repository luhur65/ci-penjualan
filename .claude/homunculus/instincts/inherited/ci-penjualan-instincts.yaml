# Ci Penjualan Workflow Implement Real Time Notifications Websocket

## Action

Follow the implement-real-time-notifications-websocket workflow:
1. Add or update Socket.IO client initialization in public/libraries/js/script.js
2. Update or create server-side websocket handler (e.g., public/my-component/Socket.js)
3. Modify layout or modal views to inject websocket-related variables or UI (e.g., app/Views/layouts/app.php, app/Views/user/modal.php)
4. Update notification display logic (e.g., using Swal.fire or dropdown in app/Views/layouts/navbar.php)
5. Update configuration files if necessary (e.g., app/Config/Api.php)
6. Add or update notification-related database migrations (e.g., app/Database/Migrations/...)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: public/libraries/js/script.js, public/my-component/Socket.js, app/Views/layouts/app.php

